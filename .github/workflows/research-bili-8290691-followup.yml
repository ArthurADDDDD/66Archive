name: Research Xierwei archive parts

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expand known Xierwei multi-P archive
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Referer':'https://www.bilibili.com/'}
          def get(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=25) as r:
                return json.loads(r.read().decode('utf-8','replace'))
            except Exception as e:
              return {'error':repr(e),'url':url}
          bv='BV1Bx411a7J2'
          out={
            'bvid':bv,
            'view':get('https://api.bilibili.com/x/web-interface/view?'+urllib.parse.urlencode({'bvid':bv})),
            'pages':get('https://api.bilibili.com/x/player/pagelist?'+urllib.parse.urlencode({'bvid':bv})),
          }
          open('xierwei-121p.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          pages=(out.get('pages') or {}).get('data') or []
          print('PARTS',len(pages))
          for p in pages:
            print(p.get('page'), p.get('duration'), p.get('part'))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xierwei-121p-metadata
          path: xierwei-121p.json
          retention-days: 7
