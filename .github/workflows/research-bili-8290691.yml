name: Research Bilibili 8290691 catalog

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture raw Bilibili search HTML
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          meta=[]
          for page in (1,2,3):
              url='https://search.bilibili.com/all?'+urllib.parse.urlencode({'keyword':'156277','page':page})
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://www.bilibili.com/','Accept-Language':'zh-CN,zh;q=0.9'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  text=r.read().decode('utf-8','replace')
              open(f'bili-search-156277-p{page}.html','w',encoding='utf-8').write(text)
              meta.append({'page':page,'bytes':len(text),'titles':sorted(set(re.findall(r'DOUYU_156277_[0-9_]+(?:_bilibili)?',text))),'bvs':sorted(set(re.findall(r'BV[0-9A-Za-z]{10}',text)))})
          open('meta.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY

      - name: Upload raw search pages
        uses: actions/upload-artifact@v7
        with:
          name: bili-8290691-search-html
          path: |
            bili-search-156277-p1.html
            bili-search-156277-p2.html
            bili-search-156277-p3.html
            meta.json
          if-no-files-found: error
          retention-days: 7
