name: Research Bilibili 8290691 catalog

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover and verify candidate BVs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.parse, urllib.request, urllib.error

          UID = 8290691
          PREFIX = 'DOUYU_156277_'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def get(url, timeout=15):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': 'https://www.bilibili.com/',
                  'Accept': 'application/json,text/plain,*/*',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read().decode('utf-8', 'replace')

          candidate_bvs = set()
          discovered_titles = set()
          search_pages = []

          # The SSR search source exposes both real BV links and machine titles, but their
          # DOM association is unstable. Use it only for discovery, never for final mapping.
          for page in range(1, 21):
              url = 'https://search.bilibili.com/all?' + urllib.parse.urlencode({'keyword':'156277','page':page})
              try:
                  status, text = get(url)
              except Exception as e:
                  search_pages.append({'page':page,'error':repr(e)})
                  break

              titles = set(re.findall(r'DOUYU_156277_[0-9_]+(?:_bilibili)?', text))
              discovered_titles.update(titles)
              page_candidates = set()
              for tm in re.finditer(r'DOUYU_156277_[0-9_]+(?:_bilibili)?', text):
                  # Wide enough to include the surrounding result payload; false positives are
                  # harmless because every BV is verified against its own video metadata below.
                  window = text[max(0,tm.start()-12000):min(len(text),tm.end()+12000)]
                  page_candidates.update(re.findall(r'BV[0-9A-Za-z]{10}', window))
              candidate_bvs.update(page_candidates)
              search_pages.append({
                  'page':page,'status':status,'bytes':len(text),
                  'titles':len(titles),'candidate_bvs':len(page_candidates)
              })
              # Once several trailing pages expose no machine titles, results are exhausted.
              if page >= 6 and all(x.get('titles',0)==0 for x in search_pages[-3:]):
                  break
              time.sleep(0.7)

          verified = []
          verify_errors = []
          for i,bvid in enumerate(sorted(candidate_bvs)):
              url = 'https://api.bilibili.com/x/web-interface/view?' + urllib.parse.urlencode({'bvid':bvid})
              try:
                  status, body = get(url, 10)
                  obj = json.loads(body)
                  data = obj.get('data') or {}
                  owner = data.get('owner') or {}
                  title = str(data.get('title') or '')
                  if owner.get('mid') == UID and title.startswith(PREFIX):
                      verified.append({
                          'bvid': data.get('bvid') or bvid,
                          'aid': data.get('aid'),
                          'title': title,
                          'duration_sec': data.get('duration'),
                          'pubdate': data.get('pubdate'),
                          'owner_mid': owner.get('mid'),
                          'owner_name': owner.get('name'),
                          'view': ((data.get('stat') or {}).get('view') if isinstance(data.get('stat'),dict) else None),
                          'videos': data.get('videos'),
                      })
              except Exception as e:
                  verify_errors.append({'bvid':bvid,'error':repr(e)})
              time.sleep(0.12)

          verified.sort(key=lambda x:(x.get('title') or '',x.get('bvid') or ''))
          result = {
              'uid':UID,
              'prefix':PREFIX,
              'discovered_title_count':len(discovered_titles),
              'discovered_titles':sorted(discovered_titles),
              'candidate_bv_count':len(candidate_bvs),
              'verified_count':len(verified),
              'verified':verified,
              'verify_error_count':len(verify_errors),
              'verify_errors':verify_errors[:50],
              'search_pages':search_pages,
          }
          with open('bili-8290691-verified-catalog.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload catalog output
        uses: actions/upload-artifact@v7
        with:
          name: bili-8290691-verified-catalog
          path: bili-8290691-verified-catalog.json
          if-no-files-found: error
          retention-days: 7
