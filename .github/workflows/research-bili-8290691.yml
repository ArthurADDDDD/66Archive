name: Research Bilibili 8290691 catalog

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enumerate UID 8290691 videos containing 156277
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          UID = 8290691
          PREFIX = 'DOUYU_156277_'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def fetch(keywords):
              qs = urllib.parse.urlencode({
                  'mid': UID,
                  'keywords': keywords,
                  'pn': 0,
                  'ps': 0,
                  'orderby': 'pubdate',
              })
              url = 'https://api.bilibili.com/x/series/recArchivesByKeywords?' + qs
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': f'https://space.bilibili.com/{UID}/video',
                  'Accept': 'application/json,text/plain,*/*',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode('utf-8', 'replace')
                      return {'url': url, 'http_status': r.status, 'body': body}
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', 'replace')
                  return {'url': url, 'http_status': e.code, 'body': body, 'error': repr(e)}
              except Exception as e:
                  return {'url': url, 'error': repr(e), 'body': ''}

          probes = [fetch('DOUYU_156277_'), fetch('156277')]
          rows = {}
          summaries = []

          for p in probes:
              rec = {'url': p['url'], 'http_status': p.get('http_status'), 'error': p.get('error')}
              try:
                  obj = json.loads(p.get('body') or '{}')
                  rec['code'] = obj.get('code')
                  rec['message'] = obj.get('message')
                  archives = ((obj.get('data') or {}).get('archives') or []) if isinstance(obj, dict) else []
                  rec['archive_count'] = len(archives)
                  for a in archives:
                      if not isinstance(a, dict):
                          continue
                      title = str(a.get('title') or '')
                      if PREFIX not in title:
                          continue
                      bvid = a.get('bvid')
                      key = bvid or f"aid:{a.get('aid')}:{title}"
                      pubdate = a.get('pubdate')
                      pubdate_iso = None
                      if isinstance(pubdate, (int, float)):
                          pubdate_iso = datetime.fromtimestamp(pubdate, tz=timezone.utc).isoformat()
                      rows[key] = {
                          'bvid': bvid,
                          'aid': a.get('aid'),
                          'title': title,
                          'duration_sec': a.get('duration'),
                          'pubdate': pubdate,
                          'pubdate_utc': pubdate_iso,
                          'view': ((a.get('stat') or {}).get('view') if isinstance(a.get('stat'), dict) else None),
                      }
              except Exception as e:
                  rec['parse_error'] = repr(e)
                  rec['body_prefix'] = (p.get('body') or '')[:1000]
              summaries.append(rec)

          result = {
              'uid': UID,
              'prefix': PREFIX,
              'probe_summaries': summaries,
              'count_unique': len(rows),
              'videos': sorted(rows.values(), key=lambda x: (x.get('title') or '', x.get('bvid') or '')),
          }

          with open('bili-8290691-catalog.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload catalog output
        uses: actions/upload-artifact@v7
        with:
          name: bili-8290691-catalog
          path: bili-8290691-catalog.json
          if-no-files-found: error
          retention-days: 7
