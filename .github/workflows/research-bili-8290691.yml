name: Research backup candidate visuals

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture first frames and storyboard samples
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,time
          BVIDS=['BV1TP4y1f7Tm','BV1UD4y167aV','BV1XB4y1G7sj','BV1Yt4y1N7P5','BV1wd4y187nf']
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          H={'User-Agent':UA,'Referer':'https://www.bilibili.com/'}
          os.makedirs('frames',exist_ok=True)
          def get(u,b=False):
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20) as r:
                x=r.read(); return x if b else x.decode('utf-8','replace')
            except Exception as e: return None
          meta=[]
          for bv in BVIDS:
            pg=json.loads(get('https://api.bilibili.com/x/player/pagelist?'+urllib.parse.urlencode({'bvid':bv})) or '{}').get('data') or []
            item={'bvid':bv,'pages':pg}
            if pg:
              p=pg[0]; cid=p['cid']; ff=p.get('first_frame')
              if ff:
                raw=get(ff.replace('http://','https://'),True)
                if raw: open(f'frames/{bv}-first.jpg','wb').write(raw)
              vs=json.loads(get('https://api.bilibili.com/x/player/videoshot?'+urllib.parse.urlencode({'bvid':bv,'cid':cid,'index':1})) or '{}').get('data') or {}
              imgs=vs.get('image') or []
              for pos in sorted(set([0,len(imgs)//2,len(imgs)-1])) if imgs else []:
                u=imgs[pos]; u='https:'+u if u.startswith('//') else u
                raw=get(u,True)
                if raw: open(f'frames/{bv}-sheet-{pos+1:02d}.jpg','wb').write(raw)
              item['sheet_count']=len(imgs)
            meta.append(item); print(bv,pg[0].get('part') if pg else None,pg[0].get('duration') if pg else None); time.sleep(.6)
          open('meta.json','w').write(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: backup-candidate-visuals
          path: |
            meta.json
            frames/
          retention-days: 7
