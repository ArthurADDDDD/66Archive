name: Research current Douyu gaps

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Recompute current 2021-2022 Douyu-only entries
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import csv, glob, json, urllib.parse, yaml

          def is_douyu(url):
              try:
                  host=(urllib.parse.urlparse(str(url)).hostname or '').lower()
              except Exception:
                  return False
              return host in {'douyu.com','douyu.tv'} or host.endswith('.douyu.com') or host.endswith('.douyu.tv')

          rows=[]
          for path in glob.glob('data/entries/*.yaml'):
              with open(path,encoding='utf-8') as f:
                  obj=yaml.safe_load(f)
              if isinstance(obj,dict):
                  items=obj.get('entries') or obj.get('items') or []
              elif isinstance(obj,list):
                  items=obj
              else:
                  continue
              for e in items:
                  if not isinstance(e,dict):
                      continue
                  date=str(e.get('date') or '')
                  if not (date.startswith('2021-') or date.startswith('2022-')):
                      continue
                  src=e.get('sources') or []
                  urls=[s.get('url') for s in src if isinstance(s,dict) and s.get('url')]
                  if urls and all(is_douyu(u) for u in urls):
                      rows.append({
                          'entry_id':e.get('id'),
                          'date':date,
                          'title':e.get('title'),
                          'duration_min':e.get('duration_min'),
                          'urls':' | '.join(urls),
                          'file':path,
                      })
          rows.sort(key=lambda r:(r['date'],r['entry_id'] or ''))
          with open('current-douyu-only-2021-2022.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['entry_id','date','title','duration_min','urls','file'])
              w.writeheader(); w.writerows(rows)
          print('COUNT',len(rows))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: current-douyu-only-2021-2022
          path: current-douyu-only-2021-2022.csv
          retention-days: 7
