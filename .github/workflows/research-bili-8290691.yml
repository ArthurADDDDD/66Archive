name: Research Bilibili 8290691 catalog

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Extract BV ids from public Bilibili search
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, urllib.parse, urllib.request, time

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          out = {'html_pages': [], 'html_matches': [], 'api_probes': []}
          known_prefix = 'DOUYU_156277_'

          def get(url, timeout=10):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': 'https://www.bilibili.com/',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read().decode('utf-8', 'replace')

          # Search HTML should contain the actual /video/BV... hrefs rendered in result cards.
          for page in range(1, 6):
              url = 'https://search.bilibili.com/all?' + urllib.parse.urlencode({'keyword':'156277','page':page})
              try:
                  status, text = get(url)
                  out['html_pages'].append({'page':page,'status':status,'bytes':len(text)})
                  for m in re.finditer(r'href=["\']([^"\']*/video/(BV[0-9A-Za-z]{10})[^"\']*)["\']', text):
                      href, bvid = html.unescape(m.group(1)), m.group(2)
                      window = text[max(0,m.start()-1500):min(len(text),m.end()+4000)]
                      titles = re.findall(r'DOUYU_156277_[0-9_]+(?:_bilibili)?', window)
                      for title in titles:
                          out['html_matches'].append({'page':page,'bvid':bvid,'title_nearby':title,'href':href})
              except Exception as e:
                  out['html_pages'].append({'page':page,'error':repr(e)})
              time.sleep(0.5)

          # Public search JSON often exposes bvid directly. Probe both current/legacy route forms.
          api_urls = [
              'https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=156277&page=1',
              'https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=156277&page=2',
              'https://app.bilibili.com/x/v2/space/archive/cursor?vmid=8290691',
              'https://api.bilibili.com/x/space/arc/search?mid=8290691&pn=1&ps=30&order=pubdate',
          ]
          for url in api_urls:
              rec = {'url':url}
              try:
                  status, text = get(url, 8)
                  rec.update({'status':status,'bytes':len(text),'prefix':text[:300]})
                  try:
                      obj=json.loads(text)
                      rec['code']=obj.get('code')
                      data=obj.get('data')
                      results=[]
                      if isinstance(data, dict):
                          if isinstance(data.get('result'), list): results=data['result']
                          elif isinstance((data.get('list') or {}).get('vlist'), list): results=data['list']['vlist']
                      rec['matches']=[{k:x.get(k) for k in ('bvid','aid','title','duration','author','mid','pubdate','created')} for x in results if isinstance(x,dict) and known_prefix in str(x.get('title',''))]
                  except Exception as e:
                      rec['json_error']=repr(e)
              except Exception as e:
                  rec['error']=repr(e)
              out['api_probes'].append(rec)

          # Deduplicate exact bvid/title pairs produced by loose HTML windows.
          dedup={}
          for x in out['html_matches']:
              dedup[(x['bvid'],x['title_nearby'])]=x
          out['html_matches']=list(dedup.values())

          with open('bili-8290691-fast-probe.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v7
        with:
          name: bili-8290691-fast-probe
          path: bili-8290691-fast-probe.json
          if-no-files-found: error
          retention-days: 7
