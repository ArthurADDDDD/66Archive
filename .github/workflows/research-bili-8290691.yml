name: Research Bilibili 8290691 catalog

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture Bilibili search pages 16-50
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          meta=[]
          empty=0
          for page in range(16,51):
              url='https://search.bilibili.com/all?'+urllib.parse.urlencode({'keyword':'156277','page':page})
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://www.bilibili.com/','Accept-Language':'zh-CN,zh;q=0.9'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      text=r.read().decode('utf-8','replace')
              except Exception as e:
                  meta.append({'page':page,'error':repr(e)})
                  break
              titles=sorted(set(re.findall(r'DOUYU_156277_[0-9_]+(?:_bilibili)?',text)))
              bvs=sorted(set(re.findall(r'BV[0-9A-Za-z]{10}',text)))
              open(f'bili-search-156277-p{page}.html','w',encoding='utf-8').write(text)
              meta.append({'page':page,'bytes':len(text),'title_count':len(titles),'bv_count':len(bvs),'titles':titles})
              empty = empty + 1 if not titles else 0
              if empty >= 3:
                  break
              time.sleep(0.45)
          open('meta-remaining.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY

      - name: Upload raw search pages
        uses: actions/upload-artifact@v7
        with:
          name: bili-8290691-search-html-remaining
          path: |
            bili-search-156277-p*.html
            meta-remaining.json
          if-no-files-found: error
          retention-days: 7
