name: Research Bilibili 8290691 catalog

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Parse exact Bilibili search cards for UID 8290691
        shell: bash
        run: |
          python -m pip install -q beautifulsoup4
          python - <<'PY'
          import json, re, time, urllib.parse, urllib.request, urllib.error
          from bs4 import BeautifulSoup

          UID = '8290691'
          PREFIX = 'DOUYU_156277_'
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Referer': 'https://www.bilibili.com/',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.read().decode('utf-8', 'replace')

          queries = [
              '156277',
              'DOUYU_156277_',
              'DOUYU 156277',
          ]
          rows = {}
          page_stats = []
          debug = []

          for query in queries:
              empty_streak = 0
              for page in range(1, 51):
                  url = 'https://search.bilibili.com/all?' + urllib.parse.urlencode({
                      'keyword': query,
                      'page': page,
                      'order': 'pubdate',
                  })
                  try:
                      status, text = get(url)
                  except Exception as e:
                      page_stats.append({'query':query,'page':page,'error':repr(e)})
                      break

                  soup = BeautifulSoup(text, 'html.parser')
                  page_found = 0
                  page_cards = 0

                  # Result cards have a video href; use the smallest useful ancestor containing
                  # both that href and the machine-title. Then verify uploader UID when exposed.
                  for a in soup.find_all('a', href=re.compile(r'/video/BV[0-9A-Za-z]{10}')):
                      href = a.get('href') or ''
                      m = re.search(r'/video/(BV[0-9A-Za-z]{10})', href)
                      if not m:
                          continue
                      bvid = m.group(1)

                      card = a
                      chosen = None
                      for _ in range(8):
                          card = getattr(card, 'parent', None)
                          if card is None:
                              break
                          raw = str(card)
                          if PREFIX in raw:
                              chosen = card
                              # stop as soon as this ancestor also contains the video href
                              # and is small enough to represent one card rather than the page.
                              if len(raw) < 30000:
                                  break
                      if chosen is None:
                          continue

                      raw = str(chosen)
                      titles = sorted(set(re.findall(r'DOUYU_156277_[0-9_]+(?:_bilibili)?', raw)))
                      if len(titles) != 1:
                          continue
                      title = titles[0]

                      # Strong author check: prefer explicit space link / mid in the same card.
                      uid_match = (f'space.bilibili.com/{UID}' in raw or f'"mid":{UID}' in raw or f'"mid":"{UID}"' in raw)
                      # If UID is absent in SSR markup, preserve as unverified instead of rejecting.
                      text_content = chosen.get_text(' ', strip=True)
                      key = (bvid, title)
                      rec = {
                          'bvid': bvid,
                          'title': title,
                          'query': query,
                          'page': page,
                          'author_uid_confirmed_in_card': uid_match,
                          'card_text': text_content[:600],
                          'href': href,
                      }
                      old = rows.get(key)
                      if old is None or (uid_match and not old.get('author_uid_confirmed_in_card')):
                          rows[key] = rec
                      page_found += 1
                      page_cards += 1

                  page_stats.append({'query':query,'page':page,'status':status,'bytes':len(text),'matches':page_found})
                  if page_found == 0:
                      empty_streak += 1
                  else:
                      empty_streak = 0
                  # Search results for this niche query exhaust quickly. Keep a few trailing pages,
                  # then stop to avoid unnecessary requests / bans.
                  if page >= 5 and empty_streak >= 3:
                      break
                  time.sleep(0.8)

          # Group by title; exact mapping is high confidence only when one title maps to one BV,
          # or when the author UID is explicitly present in the same card.
          by_title = {}
          for rec in rows.values():
              by_title.setdefault(rec['title'], []).append(rec)

          exact = []
          ambiguous = []
          for title, items in sorted(by_title.items()):
              confirmed = [x for x in items if x['author_uid_confirmed_in_card']]
              unique_bvs = sorted(set(x['bvid'] for x in confirmed))
              if len(unique_bvs) == 1:
                  best = next(x for x in confirmed if x['bvid'] == unique_bvs[0])
                  exact.append(best)
              elif len(items) == 1:
                  # One-card-only mapping is useful but explicitly lower confidence.
                  x = items[0].copy()
                  x['mapping_confidence'] = 'single-card-no-uid'
                  exact.append(x)
              else:
                  ambiguous.append({'title':title,'items':items})

          result = {
              'uid': int(UID),
              'prefix': PREFIX,
              'exact_count': len(exact),
              'exact': exact,
              'ambiguous_count': len(ambiguous),
              'ambiguous': ambiguous,
              'page_stats': page_stats,
          }
          with open('bili-8290691-search-card-catalog.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload catalog output
        uses: actions/upload-artifact@v7
        with:
          name: bili-8290691-search-card-catalog
          path: bili-8290691-search-card-catalog.json
          if-no-files-found: error
          retention-days: 7
