name: Research all 2021-2022 live entries

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Extract all 2021-2022 live entries and source coverage
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import csv, glob, json, urllib.parse, yaml

          def host(url):
              try:
                  return (urllib.parse.urlparse(str(url)).hostname or '').lower()
              except Exception:
                  return ''

          rows=[]
          for path in glob.glob('data/entries/*.yaml'):
              with open(path,encoding='utf-8') as f:
                  obj=yaml.safe_load(f)
              if isinstance(obj,dict):
                  items=obj.get('entries') or obj.get('items') or []
              elif isinstance(obj,list):
                  items=obj
              else:
                  continue
              for e in items:
                  if not isinstance(e,dict) or e.get('type')!='live':
                      continue
                  date=str(e.get('date') or '')
                  if not (date.startswith('2021-') or date.startswith('2022-')):
                      continue
                  src=e.get('sources') or []
                  urls=[s.get('url') for s in src if isinstance(s,dict) and s.get('url')]
                  hosts=[host(u) for u in urls]
                  rows.append({
                      'entry_id':e.get('id'),
                      'date':date,
                      'title':e.get('title'),
                      'duration_min':e.get('duration_min'),
                      'source_count':len(urls),
                      'bilibili_count':sum(h=='bilibili.com' or h.endswith('.bilibili.com') for h in hosts),
                      'acfun_count':sum(h=='acfun.cn' or h.endswith('.acfun.cn') for h in hosts),
                      'douyu_count':sum(h in {'douyu.com','douyu.tv'} or h.endswith('.douyu.com') or h.endswith('.douyu.tv') for h in hosts),
                      'non_douyu_count':sum(not (h in {'douyu.com','douyu.tv'} or h.endswith('.douyu.com') or h.endswith('.douyu.tv')) for h in hosts),
                      'urls':' | '.join(urls),
                      'file':path,
                  })
          rows.sort(key=lambda r:(r['date'],r['entry_id'] or ''))
          fields=['entry_id','date','title','duration_min','source_count','bilibili_count','acfun_count','douyu_count','non_douyu_count','urls','file']
          with open('all-live-entries-2021-2022.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader(); w.writerows(rows)
          print('COUNT',len(rows))
          print('UNIQUE_DATES',len(set(r['date'] for r in rows)))
          print('NO_BILIBILI',sum(r['bilibili_count']==0 for r in rows))
          print('DOUYU_ONLY',sum(r['source_count']>0 and r['non_douyu_count']==0 for r in rows))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: all-live-entries-2021-2022
          path: all-live-entries-2021-2022.csv
          retention-days: 7
