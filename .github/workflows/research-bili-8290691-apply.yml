name: Apply HAAK and verified 8290691 follow-up

on:
  push:
    branches:
      - research/bili-8290691-catalog

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply-haak.py
          python /tmp/apply-haak.py

      - name: Validate
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate

      - name: Commit
        shell: bash
        run: |
          git config user.name "AD"
          git config user.email "88820009+ArthurADDDDD@users.noreply.github.com"
          git add data/games.yaml data/entries/2022-08-douyu-live.yaml data/entries/2022-11-douyu-live.yaml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "data: add HAAK to 2022-08-25 livestream"
          git push origin HEAD:main
