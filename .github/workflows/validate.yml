name: Validate

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 游戏搜索框的匹配逻辑。它的失败方式不是抛错而是"搜不到"——
      # 排序或别名匹配退化了没人会报 bug，用户只会转去填自由文本，
      # 而那要人工处理一遍。跑在真实的 587 条词库上。
      - name: Verify game search matching
        run: npm run test:vote-search

      - name: Validate data and build static site
        run: npm run build
