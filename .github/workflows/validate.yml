name: Validate

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'public/images/covers/**'
      - 'public/images/avatars/**'
      - 'public/icons/**'
      - 'public/manifest.json'
      - 'public/gallery/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'public/images/covers/**'
      - 'public/images/avatars/**'
      - 'public/icons/**'
      - 'public/manifest.json'
      - 'public/gallery/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 网站快捷方式使用头像，开播通知仍然使用铃铛；检验所有 PNG 尺寸及路径。
      - name: Verify app identity icons and Web Push icon separation
        run: npm run test:site-icons

      # 游戏搜索框的匹配逻辑。它的失败方式不是抛错而是"搜不到"——
      # 排序或别名匹配退化了没人会报 bug，用户只会转去填自由文本，
      # 而那要人工处理一遍。跑在真实的 587 条词库上。
      - name: Verify game search matching
        run: npm run test:vote-search

      # 录播室筛选面板的游戏列表查找：只滤显示的行、保持场次顺序。
      - name: Verify archive game list lookup
        run: npm run test:game-list-filter

      # 游戏时间轴契约与游戏环节时长计算。算错时不报错，只会让排行悄悄变样、
      # 或让跳转落到别的分 P；这里含「各游戏时长之和不超过录像时长」的守恒检查，
      # 并在真实档案上确认没有时间轴的多游戏场次不给任何游戏计时。
      - name: Verify game timelines and game time
        run: npm run test:game-time

      - name: Verify game chapter projections and jumps
        run: npm run test:game-chapters

      - name: Verify game-specific missing footage states
        run: npm run test:game-footage

      # 档案载荷的编解码。它守的是一次真实线上事故：JSON 与 JS 分开缓存，
      # 边缘上两者版本错位时，新解码器会读到旧格式的条目。这个脚本里那 400 条
      # 「旧格式原样通过」的断言就是那次的回归护栏，不在 CI 里跑等于没有护栏。
      - name: Verify archive query state
        run: npm run test:archive-query

      - name: Verify archive loading and retry lifecycle
        run: npm run test:archive-loader

      - name: Verify archive payload encoding
        run: npm run test:archive-payload

      # 读者看到的每一句页面文字都要在 SITE_COPY.texts 里登记，否则后台改不到它。
      # 漏登记不会让构建失败，只会让那句话在后台永远改不动——必须由测试挡住。
      - name: Verify site text registry
        run: npm run test:site-texts

      # 站点版本公告：近 30 天功能合并、同版本只提醒一次、新功能再次提醒。
      - name: Verify visitor update notice
        run: npm run test:update-notice

      # 申请成功仍需点邮件链接及确认页按钮；不得误称已经订阅成功。
      - name: Verify email opt-in confirmation guidance
        run: node scripts/test-email-optin-guidance.mjs

      # 埋点上报口径：重复点击合并、自动化会话不计入、站内链接解析。
      # 退化了不会报错，只会让统计悄悄变得不可信。
      - name: Verify analytics reporting rules
        run: npm run test:analytics

      # archive:edit 是维护者改单条档案的唯一入口，它直接写 data/** 并提交。
      - name: Verify archive edit core
        run: npm run archive:test

      # 这条流水线只做校验，产物不发布，所以关掉构建期的内容烤入。
      # 开着的话，每次 push 的构建都要求线上站点此刻可达且三份内容都取得到，
      # 取不到就中止构建——于是站点侧的任何波动都会让 CI 变红，
      # 而报错内容和本次改动毫无关系，排查方向会被整个带偏。
      # 发布用的构建另有其事，那里才需要真的烤入。
      - name: Validate data and build static site
        env:
          CONTENT_BAKE_ORIGIN: 'off'
        run: npm run build

      - name: Verify collection source landing parts
        run: npm run test:source-links

      - name: Verify archive audit candidate classification
        run: npm run test:audit-candidates

      - name: Verify route prefetch scheduling
        run: npm run test:route-prefetch

      - name: Verify live content request lifecycle
        run: npm run test:live-content

      - name: Verify responsive covers and exported image candidates
        run: |
          npm run test:covers
          npm run audit:covers
