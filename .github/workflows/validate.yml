name: Validate

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary deployed image proxy network benchmark
        run: python3 scripts/live-img-proxy-curl-audit.py

      # 游戏搜索框的匹配逻辑。它的失败方式不是抛错而是"搜不到"——
      # 排序或别名匹配退化了没人会报 bug，用户只会转去填自由文本，
      # 而那要人工处理一遍。跑在真实的 587 条词库上。
      - name: Verify game search matching
        run: npm run test:vote-search

      # 这条流水线只做校验，产物不发布，所以关掉构建期的内容烤入。
      # 开着的话，每次 push 的构建都要求线上站点此刻可达且三份内容都取得到，
      # 取不到就中止构建——于是站点侧的任何波动都会让 CI 变红，
      # 而报错内容和本次改动毫无关系，排查方向会被整个带偏。
      # 发布用的构建另有其事，那里才需要真的烤入。
      - name: Validate data and build static site
        env:
          CONTENT_BAKE_ORIGIN: 'off'
        run: npm run build
