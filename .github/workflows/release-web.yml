name: release-web (shadow)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-web-${{ github.sha }}
  cancel-in-progress: false

jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require explicit production origin
        run: |
          node -e 'const u = new URL(process.env.SITE_ORIGIN); if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) process.exit(1)'
      - run: npm ci
      - run: npm run validate && npm run test:vote-search
      - name: Test artifact safety gates
        run: node --test scripts/release/test-compare-shadow.cjs && python3 scripts/release/test-audit-image.py
      - name: Generate and reproduce snapshot
        run: |
          npx tsx scripts/build-snapshot.ts
          cp .local/dataset-snapshot.json .local/snapshot-first.json
          npx tsx scripts/build-snapshot.ts
          cmp .local/snapshot-first.json .local/dataset-snapshot.json
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build production site with live public content
        run: npm run build
      - name: Prepare minimal image context
        run: |
          test -f out/index.html
          mkdir -p .local/context/site .local/context/snapshot .local/release
          cp -a out/. .local/context/site/
          cp .local/dataset-snapshot.json .local/dataset-snapshot.json.sha256 .local/context/snapshot/
      - uses: docker/setup-buildx-action@v3
      - name: Build OCI image without registry publication
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --tag "66archive-web:$GITHUB_SHA" \
            --output type=oci,dest=.local/release/66archive-web.tar,rewrite-timestamp=true \
            --file Dockerfile.web-artifact .local/context
      - name: Inspect all image layers and snapshot integrity
        run: python3 scripts/release/audit-image.py .local/release/66archive-web.tar "$GITHUB_SHA" .local/release/image-report.json
      - name: Fail closed on existing SHA digest mismatch
        id: compare
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/release/compare-shadow.cjs')({ github, context, core })
      - uses: actions/upload-artifact@v7
        if: steps.compare.outputs.exists != 'true'
        with:
          name: 66archive-web-${{ github.sha }}
          path: .local/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
