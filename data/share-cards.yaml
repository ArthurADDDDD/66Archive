# 分享卡片。链接被转发到微信 / 微博 / QQ / B站动态时，社交卡片显示的文案（og:description）
# 与图片（og:image），每个固定页面各一份，由后台「分享卡片」页面维护。
#
# image 为 null 表示这一页还没单独设过图，前台落到全站默认图（page-metadata.ts 的
# OG_IMAGE）。它不是手改的字段——由后台上传图片后，CI 落盘步骤写回这里，取值形如
# /images/og/<id>-<内容哈希>.jpg。
#
# 这份文件改了不会立刻生效——og 标签只在构建静态页面时写进 HTML 一次，社交平台的
# 爬虫不会跑前端 JS 去读运行时接口，所以必须走「暂存 → 推送 → CI 重新构建」这条路，
# 和改游戏名/系列简介完全同一条路，不是站内文字那种即时生效。

