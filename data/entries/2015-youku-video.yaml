# 2015 年优酷官方号投稿补录（2026-09-20 新建）。
#
# 本仓原先把优酷期当成「2010-05 ~ 2015-02」的视频时代，2015-02 之后转斗鱼直播
# （见 2010-2015-youku-video.yaml 顶部说明）。但互联网档案馆抓取的本人优酷空间
# 视频列表页（i.youku.com/u/UMjQyOTM1MzA4/videos）显示，官方优酷号在 2015-02 之后
# **仍在持续投稿**：2015 年 7—9 月至少有 HER STORY 系列、直播录像精剪、
# 女流杯建筑大赛等；2015-12 之后的抓取里还能看到 Rusty Lake、Inside、
# 心灵砒霜等更晚的条目。也就是说优酷号并没有在 2015-02 停更。
#
# 这个文件只收**已核实到发布时间与时长**的那部分。日期口径与 2015-bilibili-video.yaml
# 一致：video 条目用上传日期。标题含「直播录像/生放送」的不放这里——那类需要人工
# 核对片头才能判定是预录还是直播回放，未核对前一律只作为线索记录在
# data/reports/task-036-youku-space-videos.md，不入库。

