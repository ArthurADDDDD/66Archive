# 标签词表（受控）。entries 的 tags 只能使用这里登记过的 name，validate 会拦住未登记值。
#
# 为什么要受控：tags 不只是展示用的形容词，其中一部分被代码按「字符串精确等于系列名」
# 消费——写错一个字，条目会静静地从系列页消失、首页「N 期心灵砒霜」少一，且没有任何报错。
# 把允许值集中登记，才能让这类耦合是显式的、可查的。
#
# group 只影响内容服务选择器里的分组，不参与任何前台计算。
# binds_series 必须在 name 与 series.yaml 某个系列同名时填写：这是承重耦合的显式声明，
# validate 会强制要求（见 scripts/validate.ts）。
#
# 新增标签有两条路，都由人类发起：
#   1. 在此处人工添加一行；
#   2. 在内容服务的「档案条目」里登记，与那一批条目修改一起落盘——
#      同样过登录、权限与本文件的 validate，写进来的 diff 就是下面这几行的样子。
# 采集 Agent 不自行新增，在交付说明里单列。仅登记而暂时没有条目使用是允许的。
# 维护：架构角色（2026-08-14 首次建立，初始值全部来自当时 entries 里的实际用法）

# —— 系列 / 栏目：与 series.yaml 同名，前端据此把条目并入系列页并生成「相关栏目」链接 ——
- name: 心灵砒霜
  group: series
  binds_series: xinling-pishuang
  description: "斗鱼时代的固定栏目。除系列归属外，首页蒙太奇卡的「N 期心灵砒霜」也来自这个标签的计数。"

- name: 戏说聊斋
  group: series
  binds_series: xishuo-liaozhai
  description: "斗鱼时代栏目。"

- name: 吃鸡佳缘
  group: series
  binds_series: chiji-jiayuan
  description: "斗鱼时代栏目。"

