# 系列 / 栏目表。定义女流各时期的连载系列与固定栏目，供前端时间轴按系列高亮与筛选。
# 维护：data-agent（2026-08-11）。仅收录 entries 数据中可证实的系列（按标题/栏目 tag 精确匹配统计），不推测。
# game 字段仅在对应游戏已登记入 games.yaml 时填写；视频时代系列的游戏均未登记，故留空。
# 注意：光之子 Part2 以《不玩也爱看》第14期名义发布，该条归属「不玩也爱看」系列，光之子系列对应少 1 期。

# —— 视频时代（2010-05 ~ 2015-02，优酷解说）——
- id: anqila-zhige
  name: 安琪拉之歌全剧情
  description: "《安琪拉之歌》（Aquaria）的全流程解说。2010 年开更，中间赶上读研，一拖就是好几年——Part 3、4 补在 2012 年 5 月，最后一期等到 2014 年 9 月才来。"
- id: child-of-light
  name: 光之子全剧情
  description: "《光之子》（Child of Light）的全流程。2014 年 11 月到 12 月一个月内连更完，Part 1 到 6 再加一期大结局；Part 2 当年是挂在《不玩也爱看》第 14 期下发的，所以归在那个系列里。"
- id: bukan-ye-aikan
  name: 不玩也爱看
  description: "视频时代最后那阵子的栏目，2014 年 10 月更到 11 月。聊过植物大战僵尸 RAP、愤怒的小鸟、我的世界漂流记、忍者神龟年代记，也聊过光之子。"
- id: journey-playthrough
  name: 风之旅人全流程赏析
  description: "《风之旅人》（Journey）的全流程赏析，2013 年 9 月更完——那年下半年重新开始更新之后，最有代表性的一组。"
- id: xingtan-guide
  name: 星探系列攻略
  game: hoshi-saga
  description: "《星探》（Hoshi Saga）的系列攻略。2010 年 5 月 11 日一口气发了系列 1、2、5，第二天补上 3 和 4。"
- id: huanxing-hezi
  name: 唤醒盒子
  description: "《唤醒盒子》的试玩。2010 年玩了第二作，隔了将近两年，2012 年又回来玩第四作。"
- id: xiaoyouxi-hen-baoli
  name: 小游戏也可以很暴力
  description: "第一弹和第二弹，2010 年 5 月 10 日同一天连着发出来。"

