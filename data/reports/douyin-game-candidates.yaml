  - 王者荣耀：世界与王者荣耀为不同作品——前者为王者在建开放世界 RPG，已分开归类。
  - 《鸣潮 × 赛博朋克：边缘行者》联动条目仅计入《鸣潮》，不重复计入《赛博朋克2077》。
  - 2025-03-07/08 炮炮标题"双人成行2"实际为《双影奇境》（双人成行团队新作=Split Fiction），已归入双影奇境。《双人成行》候选已删除。
  - 使命召唤：黑色行动7使用具体作品名而非笼统 COD。
  - 刺客信条：黑旗 记忆重置未确认是否为正式重制版，置信度 medium。
  - 三角洲首届猛攻杯为赛事内容，该事件置信度 medium。
  - 战地666…完整上下文为口头禅/梗（666 = 中文很厉害），非《战地》系列游戏，不收录。
  - 2026-01-09-live-01 逛黑神话悟空杭州线下店为线下探店非游玩，已排除。
  - 太吾绘卷线下试玩会无法区分试玩游戏和仅参加活动，置信度 medium。
  - 已删除所有零命中候选，不存在报告说 0 条但 YAML 列出的矛盾。
  - 删除了原《双人成行》候选——2 个事件均改归《双影奇境》（炮炮标题"双人成行2"即双人成行团队新作）。
